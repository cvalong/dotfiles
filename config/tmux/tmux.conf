# Leader: Ctrl-Space. Ctrl-b clobbers the page-back muscle memory; Ctrl-a fights
# shell beginning-of-line. Ctrl-Space is unused almost everywhere.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# 256-color + true color passthrough — most modern terminals (Ghostty, WezTerm,
# Alacritty) support this; older boxes ignore it.
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*256col*:RGB"

set -g history-limit 50000
set -sg escape-time 10

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Splits open in the current pane's directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

set -g status-position top
set -g status-style "bg=default,fg=white"
set -g status-left "#[bold]#S #[default]"
set -g status-right "%Y-%m-%d %H:%M"
